name: Yahoo options to BigQuery

on:
  schedule:
    # Mon-Fri 21:15 UTC: after the US market close (4:00 pm New York) all year.
    - cron: "15 21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: yahoo-options-to-bigquery
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GCP_PROJECT_ID: prueba-server-507503
      BQ_DATASET: yahoo_finance
      BQ_TABLE: options_chain
      TICKERS: SOXL,SPXL,TQQQ,TECL,NVDL,AAPL
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: yahoo-options-pipeline/requirements.txt

      - run: pip install -r yahoo-options-pipeline/requirements.txt

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - run: python yahoo-options-pipeline/options_to_bigquery.py
